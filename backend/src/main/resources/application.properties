spring.application.name=south-beach-reservations
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/southbeach-reservations;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

app.security.admin-username=${APP_ADMIN_USERNAME:admin}
app.security.admin-password=${APP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}

spring.jackson.serialization.write-dates-as-timestamps=false

# Length of a table booking; confirmed reservations closer than this count against the same capacity.
app.reservations.duration-minutes=${RESERVATION_DURATION_MINUTES:90}

# Notifications. Email uses any SMTP provider; SMS stays a no-op until a gateway is implemented.
app.notifications.email.enabled=${NOTIFY_EMAIL_ENABLED:false}
app.notifications.email.from=${NOTIFY_EMAIL_FROM:reservas@southbeach.co.mz}
app.notifications.reminders.enabled=${NOTIFY_REMINDERS_ENABLED:true}
app.notifications.reminders.cron=${NOTIFY_REMINDERS_CRON:0 0 10 * * *}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.health.mail.enabled=false
